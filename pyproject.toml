[project]
name = "observatorio-idp"
version = "0.1.0"
description = "Serviço central de identidade do ecossistema Observatório"
authors = [
    {name = "meirelesgc", email = "geu_costa@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "aiosqlite>=0.20.0",
    "pyjwt[crypto]>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^1.4.0"
taskipy = "^1.14.0"
ruff = "^0.7.0"
factory-boy = "^3.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['E501', 'PLR0913', 'PLR0917']

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['PLR2004', 'PLR0914', 'PT004', 'PT011', 'PT018', 'E501']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
format = 'ruff check . --fix && ruff format .'
run = 'fastapi dev app/main.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=app -vv'
post_test = 'coverage html'
