services:
  idp:
    build: .
    container_name: observatorio-idp
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/observatorio_idp
      - IDP_ISSUER=http://localhost:8000
      - FRONTEND_AUTH_CALLBACK_URL=http://localhost:3000/auth/callback
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: observatorio-idp-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=observatorio_idp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
